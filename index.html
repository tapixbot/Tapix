<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapix Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #111827);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding-bottom: 75px;
        }
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand-logo {
            font-size: 16px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .stats-group {
            display: flex;
            gap: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .stat-item {
            color: #facc15;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 8px;
        }
        /* Pages */
        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .page.active {
            display: flex;
        }
        /* Main Slot Machine Screen */
        .slot-machine {
            background: #1e293b;
            border: 4px solid #3b82f6;
            border-radius: 20px;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .slot-reel {
            background: #0f172a;
            border: 2px solid #64748b;
            width: 30%;
            height: 90px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .spin-main-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f59e0b, #b45309);
            border: 4px solid #fde047;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.5);
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
            margin-top: 15px;
        }
        .spin-main-btn:active {
            transform: scale(0.94);
        }
        /* Wheel Screen */
        .wheel-container {
            position: relative;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 6px solid #facc15;
            background: conic-gradient(#ef4444 0deg 90deg, #3b82f6 90deg 180deg, #10b981 180deg 270deg, #8b5cf6 270deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .wheel-center {
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 50%;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* Upgrade & Character */
        .char-preview {
            font-size: 60px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 2px dashed #3b82f6;
        }
        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #090d16;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active {
            color: #facc15;
        }
        .nav-item span {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand-logo">TAPIX</div>
            <div class="stats-group">
                <div class="stat-item">🪙 <span id="coins">1300</span></div>
                <div class="stat-item">⚡ <span id="energy">36500</span></div>
            </div>
        </div>

        <!-- 1. Main Game (Slot Machine & Spin) -->
        <div id="page-main" class="page active">
            <h3 style="color: #38bdf8;">Tapix Slot Arena</h3>
            
            <div class="slot-machine">
                <div class="slot-reel" id="reel1">🪙</div>
                <div class="slot-reel" id="reel2">⚡</div>
                <div class="slot-reel" id="reel3">🪙</div>
            </div>

            <div style="font-size: 14px; color: #94a3b8; margin-top: 5px;">Energy Left: <span id="main-energy">36500</span></div>
            <button class="spin-main-btn" onclick="doSlotSpin()">SPIN</button>
        </div>

        <!-- 2. Wheel Screen -->
        <div id="page-wheel" class="page">
            <h3 style="color: #facc15;">Wheel of Fortune</h3>
            <p style="color: #94a3b8; font-size: 12px; margin-top: 3px;">1% chance for 100k Energy!</p>
            
            <div class="wheel-container" id="fortuneWheel">
                <div class="wheel-center">🍀</div>
            </div>
            <button class="action-btn" style="background:#f59e0b; padding:10px 20px;" onclick="spinWheel()">Spin Wheel</button>
        </div>

        <!-- 3. Character Upgrade Screen -->
        <div id="page-upgrade" class="page">
            <h3 style="color: #10b981;">Character Build</h3>
            <div class="char-preview">🦹‍♂️</div>
            
            <div class="upgrade-card">
                <div style="text-align: left;">
                    <strong>Head Upgrade</strong>
                    <div style="font-size: 11px; color: #94a3b8;">Cost: 500 Coins</div>
                </div>
                <button class="action-btn" onclick="upgradeItem(500)">Upgrade</button>
            </div>
            
            <div class="upgrade-card">
                <div style="text-align: left;">
                    <strong>Body Upgrade</strong>
                    <div style="font-size: 11px; color: #94a3b8;">Cost: 1000 Coins</div>
                </div>
                <button class="action-btn" onclick="upgradeItem(1000)">Upgrade</button>
            </div>
        </div>

        <!-- 4. Invite Screen -->
        <div id="page-invite" class="page">
            <h3 style="color: #3b82f6;">Referral System</h3>
            <p style="color: #94a3b8; font-size: 12px; margin: 8px 0;">Get +150 Energy per friend invite!</p>
            
            <button class="action-btn" style="background:#3b82f6; width:100%; padding:10px; margin-bottom:12px;" onclick="copyRefLink()">Copy Invite Link</button>
            
            <h4 style="margin-top: 10px; margin-bottom: 6px; align-self: flex-start; font-size: 13px;">Invited Friends (0):</h4>
            <div id="friends-list" style="width: 100%; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; min-height: 70px; color: #94a3b8; font-size: 12px; text-align: center;">
                No friends joined yet.
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('main', this)"><span>🎰</span>Game</button>
        <button class="nav-item" onclick="switchPage('wheel', this)"><span>🎡</span>Wheel</button>
        <button class="nav-item" onclick="switchPage('upgrade', this)"><span>👕</span>Upgrade</button>
        <button class="nav-item" onclick="switchPage('invite', this)"><span>👥</span>Invite</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        let coins = 1300;
        let energy = 36500;

        const icons = ['🪙', '⚡', '🎁', '💎'];

        function updateUI() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('energy').innerText = energy;
            document.getElementById('main-energy').innerText = energy;
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            btn.classList.add('active');
        }

        function doSlotSpin() {
            if (energy > 0) {
                energy -= 1;
                
                // Randomize slot reels animation effect
                document.getElementById('reel1').innerText = icons[Math.floor(Math.random() * icons.length)];
                document.getElementById('reel2').innerText = icons[Math.floor(Math.random() * icons.length)];
                document.getElementById('reel3').innerText = icons[Math.floor(Math.random() * icons.length)];
                
                coins += 10;
                updateUI();
            } else {
                alert('Energy is out!');
            }
        }

        function spinWheel() {
            const wheel = document.getElementById('fortuneWheel');
            let randomDegree = Math.floor(Math.random() * 3600) + 720;
            wheel.style.transform = `rotate(${randomDegree}deg)`;
            
            setTimeout(() => {
                // Probability system implementation logic
                let chance = Math.random() * 100;
                if (chance <= 1) {
                    alert('JACKPOT! You won 100k Energy!');
                    energy += 100000;
                } else if (chance <= 21) {
                    alert('Great! You won 20k Energy!');
                    energy += 20000;
                } else {
                    alert('You won standard reward!');
                    coins += 100;
                }
                updateUI();
            }, 3000);
        }

        function upgradeItem(cost) {
            if (coins >= cost) {
                coins -= cost;
                updateUI();
                alert('Successfully Upgraded!');
            } else {
                alert('Not enough coins!');
            }
        }

        function copyRefLink() {
            navigator.clipboard.writeText("https://t.me/TapixBot?start=ref123");
            alert('Tapix referral link copied!');
        }

        updateUI();
    </script>
</body>
</html>
