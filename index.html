<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOINKERS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0d1322;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding-bottom: 80px;
        }

        /* Top HUD */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #182238;
            padding: 8px 12px;
            border-radius: 20px;
            border: 3px solid #283759;
            margin-bottom: 12px;
            box-shadow: 0 4px 0 #080c16;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .hud-stats {
            display: flex;
            gap: 6px;
        }

        .hud-pill {
            background: #090d16;
            border: 2px solid #23314d;
            padding: 4px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 800;
        }

        .hud-pill.coins { color: #fbbf24; border-color: #d97706; }
        .hud-pill.energy { color: #38bdf8; border-color: #0284c7; }

        /* Pages */
        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .page.active {
            display: flex;
        }

        /* Main Game Box */
        .game-title {
            font-size: 28px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 3px 0 #b45309, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .slot-frame {
            background: #2563eb;
            border: 6px solid #1d4ed8;
            border-radius: 26px;
            width: 100%;
            padding: 16px;
            box-shadow: 0 8px 0 #1e3a8a, inset 0 4px 0 rgba(255,255,255,0.3);
            position: relative;
        }

        .slot-display {
            background: #ffffff;
            border: 4px solid #0f172a;
            border-radius: 18px;
            display: flex;
            justify-content: space-around;
            padding: 12px 6px;
            gap: 6px;
            box-shadow: inset 0 6px 0 rgba(0,0,0,0.15);
        }

        .reel {
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            width: 31%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: inset 0 4px 0 rgba(0,0,0,0.06);
        }

        /* Big Spin Button */
        .spin-wrapper {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spin-btn {
            width: 155px;
            height: 155px;
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            border: 6px solid #ffffff;
            border-radius: 38px;
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 0 #ca8a04, 0 16px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }

        .spin-btn:active {
            transform: rotate(45deg) scale(0.95);
            box-shadow: 0 6px 0 #ca8a04, 0 8px 15px rgba(0,0,0,0.4);
        }

        .spin-btn-text {
            transform: rotate(-45deg);
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 3px 0 #a16207, -2px -2px 0 #a16207, 2px -2px 0 #a16207, -2px 2px 0 #a16207;
            text-align: center;
            line-height: 1;
        }

        .spin-btn-sub {
            font-size: 10px;
            color: #fef08a;
            display: block;
            margin-top: 4px;
        }

        /* Wheel Area */
        .wheel-box {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 20px 0;
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #facc15;
            background: conic-gradient(
                #ef4444 0deg 45deg, 
                #3b82f6 45deg 135deg, 
                #10b981 135deg 225deg, 
                #f59e0b 225deg 315deg,
                #8b5cf6 315deg 360deg
            );
            box-shadow: 0 8px 0 #b45309;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .wheel-arrow {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #facc15;
            z-index: 10;
        }

        /* Buttons & Cards */
        .btn-boinker {
            background: #facc15;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 800;
            box-shadow: 0 4px 0 #ca8a04;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-boinker:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ca8a04;
        }

        .item-card {
            background: #182238;
            border: 3px solid #283759;
            border-radius: 18px;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 #080c16;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #090d16;
            border-top: 4px solid #182238;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
        }

        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #facc15;
        }

        .nav-item span {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top HUD -->
        <div class="top-hud">
            <div class="profile-area">
                <div class="avatar">🐷</div>
                <div style="font-size: 13px; font-weight: 900; color: #ffffff;">BOINKERS</div>
            </div>
            <div class="hud-stats">
                <div class="hud-pill coins">🪙 <span id="coins">0</span></div>
                <div class="hud-pill energy">⚡ <span id="energy">0</span></div>
            </div>
        </div>

        <!-- 1. MAIN GAME PAGE -->
        <div id="page-main" class="page active">
            <div class="game-title">BOINKERS</div>
            
            <div class="slot-frame">
                <div class="slot-display">
                    <div class="reel" id="reel1">🪙</div>
                    <div class="reel" id="reel2">⚡</div>
                    <div class="reel" id="reel3">🪙</div>
                </div>
            </div>

            <div class="spin-wrapper">
                <div class="spin-btn" onclick="spinSlot()">
                    <div class="spin-btn-text">
                        SPIN
                        <span class="spin-btn-sub">1 ENERGY</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. WHEEL PAGE -->
        <div id="page-wheel" class="page">
            <div class="game-title">RINGO WHEEL</div>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">1% Chance to get 100k Energy!</p>

            <div class="wheel-box">
                <div class="wheel-arrow"></div>
                <div class="wheel-canvas" id="wheelCanvas"></div>
            </div>

            <button class="btn-boinker" style="font-size: 16px; padding: 12px 30px;" onclick="spinWheel()">SPIN WHEEL</button>
        </div>

        <!-- 3. UPGRADE PAGE -->
        <div id="page-upgrade" class="page">
            <div class="game-title" style="color: #38bdf8;">UPGRADES</div>
            <div style="font-size: 70px; margin: 10px 0;">🐷</div>

            <div class="item-card">
                <div>
                    <div style="font-size: 15px; font-weight: 900;">HEAD GEAR</div>
                    <div style="color: #fbbf24; font-size: 12px;">Cost: 500 Coins</div>
                </div>
                <button class="btn-boinker" onclick="buyItem(500)">UPGRADE</button>
            </div>

            <div class="item-card">
                <div>
                    <div style="font-size: 15px; font-weight: 900;">BODY GEAR</div>
                    <div style="color: #fbbf24; font-size: 12px;">Cost: 1000 Coins</div>
                </div>
                <button class="btn-boinker" onclick="buyItem(1000)">UPGRADE</button>
            </div>
        </div>

        <!-- 4. INVITE PAGE -->
        <div id="page-invite" class="page">
            <div class="game-title" style="color: #4ade80;">FRIENDS</div>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 15px;">Earn +150 Energy per friend invite!</p>

            <button class="btn-boinker" style="width: 100%; padding: 14px;" onclick="copyInviteLink()">COPY INVITE LINK</button>

            <div style="width: 100%; margin-top: 20px; text-align: left;">
                <h4 style="color: #94a3b8; font-size: 12px;">INVITED FRIENDS (0):</h4>
                <div style="background: #182238; border: 2px solid #283759; border-radius: 14px; padding: 15px; margin-top: 6px; color: #64748b; font-size: 13px; text-align: center;">
                    No friends joined yet.
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('main', this)"><span>🎰</span>SPIN</button>
        <button class="nav-item" onclick="switchTab('wheel', this)"><span>🎡</span>WHEEL</button>
        <button class="nav-item" onclick="switchTab('upgrade', this)"><span>👕</span>UPGRADE</button>
        <button class="nav-item" onclick="switchTab('invite', this)"><span>👥</span>FRIENDS</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        let coins = 0;
        let energy = 0;

        const slotItems = ['🪙', '⚡', '💣', '💎'];

        function updateHUD() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('energy').innerText = energy;
        }

        function switchTab(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + pageId).classList.add('active');
            btn.classList.add('active');
        }

        function spinSlot() {
            if (energy >= 1) {
                energy -= 1;
                
                document.getElementById('reel1').innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                document.getElementById('reel2').innerText = slotItems[Math.floor(Math.random() * slotItems.length)];
                document.getElementById('reel3').innerText = slotItems[Math.floor(Math.random() * slotItems.length)];

                coins += 25;
                updateHUD();
            } else {
                alert('No Energy! Invite friends or spin the Wheel.');
            }
        }

        function spinWheel() {
            const wheel = document.getElementById('wheelCanvas');
            let deg = Math.floor(Math.random() * 3600) + 720;
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                let chance = Math.random() * 100;
                if (chance <= 1) {
                    alert('JACKPOT! +100,000 Energy!');
                    energy += 100000;
                } else if (chance <= 21) {
                    alert('BIG WIN! +15,000 Energy!');
                    energy += 15000;
                } else {
                    alert('Win: +100 Energy!');
                    energy += 100;
                }
                updateHUD();
            }, 3000);
        }

        function buyItem(cost) {
            if (coins >= cost) {
                coins -= cost;
                updateHUD();
                alert('Purchased!');
            } else {
                alert('Not enough coins!');
            }
        }

        function copyInviteLink() {
            navigator.clipboard.writeText("https://t.me/BoinkersBot?start=ref123");
            alert('Invite link copied!');
        }

        updateHUD();
    </script>
</body>
</html>
